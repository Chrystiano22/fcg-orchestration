services:
  kong:
    image: kong:3.7
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong.yml:/kong/declarative/kong.yml:ro
    depends_on:
      users-api:
        condition: service_started
      catalog-api:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      users-api:
        condition: service_started
      catalog-api:
        condition: service_started

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  users-api:
    build:
      context: ../../fcg-users-api
      dockerfile: Dockerfile
    ports:
      - "5101:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Service__Name: UsersAPI
      RabbitMq__Enabled: "true"
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      ConnectionStrings__UsersDb: Data Source=/app/data/users.db
      Database__Provider: Sqlite
      Database__ConnectionString: Data Source=/app/data/users.db
      Jwt__Issuer: fcg-users-api
      Jwt__Audience: fcg-services
      Jwt__SecretKey: development-secret-key-change-before-production
      Jwt__ExpirationInMinutes: "60"
      SeedData__Admin__Enabled: "true"
      SeedData__Admin__Name: FCG Admin
      SeedData__Admin__Email: admin@fcg.local
      SeedData__Admin__Password: Admin@123
    volumes:
      - users-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  catalog-api:
    build:
      context: ../../fcg-catalog-api
      dockerfile: Dockerfile
    ports:
      - "5102:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Service__Name: CatalogAPI
      RabbitMq__Enabled: "true"
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      ConnectionStrings__CatalogDb: Data Source=/app/data/catalog.db
      Database__Provider: Sqlite
      Database__ConnectionString: Data Source=/app/data/catalog.db
      Jwt__Issuer: fcg-users-api
      Jwt__Audience: fcg-services
      Jwt__SecretKey: development-secret-key-change-before-production
      Redis__ConnectionString: "redis:6379"
      Redis__InstanceName: "fcg-catalog:"
      Mongo__Enabled: "true"
      Mongo__ConnectionString: "mongodb://mongodb:27017"
      Mongo__DatabaseName: fcg_catalog
      Mongo__ReviewsCollectionName: game_reviews
    volumes:
      - catalog-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  payments-api:
    build:
      context: ../../fcg-payments-api
      dockerfile: Dockerfile
    ports:
      - "5103:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Service__Name: PaymentsAPI
      RabbitMq__Enabled: "true"
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      PaymentSimulation__DefaultStatus: Approved
    depends_on:
      rabbitmq:
        condition: service_healthy

  notifications-api:
    profiles:
      - legacy-notifications-api
    build:
      context: ../../fcg-notifications-api
      dockerfile: Dockerfile
    ports:
      - "5104:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Service__Name: NotificationsAPI
      RabbitMq__Enabled: "true"
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      Notifications__FromEmail: no-reply@fcg.local
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  users-data:
  catalog-data:
  mongo-data:
