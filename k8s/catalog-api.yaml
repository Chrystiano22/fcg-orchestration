apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      containers:
        - name: catalog-api
          image: compose-catalog-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: fcg-common-config
          env:
            - name: Service__Name
              value: CatalogAPI
            - name: ConnectionStrings__CatalogDb
              value: Data Source=/app/data/catalog.db
            - name: Database__Provider
              value: Sqlite
            - name: Database__ConnectionString
              value: Data Source=/app/data/catalog.db
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: fcg-rabbitmq-secret
                  key: RabbitMq__Password
            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: fcg-jwt-secret
                  key: Jwt__SecretKey
          volumeMounts:
            - name: catalog-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: catalog-data
          persistentVolumeClaim:
            claimName: catalog-data
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: fcg
spec:
  type: NodePort
  selector:
    app: catalog-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30102
