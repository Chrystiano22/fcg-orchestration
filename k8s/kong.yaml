apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-declarative-config
  namespace: fcg
data:
  kong.yml: |
    _format_version: "3.0"
    _transform: true

    consumers:
      - username: fcg-jwt-consumer
        jwt_secrets:
          - key: fcg-users-api
            secret: development-secret-key-change-before-production
            algorithm: HS256

    services:
      - name: users-api
        url: http://users-api:8080
        routes:
          - name: users-auth-login
            paths:
              - /auth
            strip_path: false
          - name: users-registration
            paths:
              - /usuarios
            methods:
              - POST
            strip_path: false
          - name: users-protected
            paths:
              - /usuarios
            methods:
              - GET
              - PATCH
            strip_path: false
            plugins:
              - name: jwt
                config:
                  key_claim_name: iss
                  claims_to_verify:
                    - exp
      - name: catalog-api
        url: http://catalog-api:8080
        routes:
          - name: catalog-protected
            paths:
              - /jogos
              - /compras
              - /biblioteca
              - /promocoes
            strip_path: false
            plugins:
              - name: jwt
                config:
                  key_claim_name: iss
                  claims_to_verify:
                    - exp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      containers:
        - name: kong
          image: kong:3.7
          ports:
            - name: proxy
              containerPort: 8000
            - name: admin
              containerPort: 8001
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/declarative/kong.yml
            - name: KONG_ADMIN_LISTEN
              value: 0.0.0.0:8001
          volumeMounts:
            - name: kong-config
              mountPath: /kong/declarative
          readinessProbe:
            httpGet:
              path: /status
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: kong-config
          configMap:
            name: kong-declarative-config
---
apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: fcg
spec:
  type: NodePort
  selector:
    app: kong
  ports:
    - name: proxy
      port: 8000
      targetPort: proxy
      nodePort: 30080
    - name: admin
      port: 8001
      targetPort: admin
      nodePort: 30081
