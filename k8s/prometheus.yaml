apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: fcg
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
    scrape_configs:
      - job_name: users-api
        metrics_path: /metrics
        static_configs:
          - targets:
              - users-api:8080
      - job_name: catalog-api
        metrics_path: /metrics
        static_configs:
          - targets:
              - catalog-api:8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: fcg
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      nodePort: 30090
